<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings | BarberZ Guild</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{--gold:#c9a24b;--dark:#0f0f0f;--card:#1a1a1a;--text:#eaeaea}
    *{box-sizing:border-box;margin:0;padding:0}
    body {
      font-family: Inter, sans-serif;
      background: var(--dark);
      color: var(--text);
      padding: 40px 6%;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }
    .logo {
      font-family: 'Bebas Neue';
      font-size: 32px;
      color: var(--gold);
      letter-spacing: 2px;
    }
    a {
      color: var(--gold);
      text-decoration: none;
    }
    h1 {
      font-family: 'Bebas Neue';
      font-size: 48px;
      color: var(--gold);
      margin-bottom: 20px;
    }
    h2 {
      font-family: 'Bebas Neue';
      font-size: 28px;
      color: var(--gold);
      margin-top: 40px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      opacity: 0.7;
    }
    input {
      padding: 12px;
      background: #111;
      border: 1px solid #333;
      color: var(--text);
      border-radius: 6px;
      font-size: 14px;
      max-width: 300px;
    }
    #slots {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 30px;
    }
    .slot {
      display: inline-block;
      margin: 6px;
      padding: 8px 12px;
      border: 1px solid #555;
      border-radius: 6px;
      font-size: 14px;
    }
    .slot.taken {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
    }
    .slot.free {
      background: var(--card);
      border-color: #444;
    }
    .booking-card {
      background: var(--card);
      border: 1px solid #333;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .booking-card strong {
      color: var(--gold);
      display: block;
      margin-bottom: 8px;
    }
    .booking-card p {
      font-size: 14px;
      margin: 4px 0;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">BARBERZ GUILD</div>
    <a href="index.html">← Back to Booking</a>
  </header>

  <h1>Bookings Overview</h1>

  <div>
    <label for="date">Filter by date:</label>
    <input id="date" type="date" />
  </div>

  <div id="slots"></div>

  <h2>Booked Customers</h2>
  <div id="bookingsList"></div>

  <script>
    const BOOKING_KEY = "barberzGuildBookings";
    const times = ["10:00","11:00","12:00","13:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"];

    function getBookings() {
      return JSON.parse(localStorage.getItem(BOOKING_KEY) || "[]");
    }

    function renderOverview() {
      const selectedDate = document.getElementById("date").value;
      const bookings = getBookings();
      const bookedTimes = bookings
        .filter(b => b.date === selectedDate)
        .map(b => b.time);

      const slots = document.getElementById("slots");
      slots.innerHTML = "";

      times.forEach(time => {
        const el = document.createElement("div");
        el.className = "slot " + (bookedTimes.includes(time) ? "taken" : "free");
        el.textContent = bookedTimes.includes(time) ? `${time} - Taken` : `${time} - Open`;
        slots.appendChild(el);
      });

      const list = document.getElementById("bookingsList");
      list.innerHTML = "";

      const filtered = selectedDate
        ? bookings.filter(b => b.date === selectedDate)
        : bookings;

      if (!filtered.length) {
        list.innerHTML = "<p>No bookings found.</p>";
        return;
      }

      filtered.forEach(booking => {
        const card = document.createElement("div");
        card.className = "booking-card";
        card.innerHTML = `
          <strong>${booking.name}</strong>
          <p><strong>Phone:</strong> ${booking.phone}</p>
          <p><strong>Service:</strong> ${booking.service}</p>
          <p><strong>Date:</strong> ${booking.date}</p>
          <p><strong>Time:</strong> ${booking.time}</p>
        `;
        list.appendChild(card);
      });
    }

    document.getElementById("date").addEventListener("change", renderOverview);
    document.getElementById("date").min = new Date().toISOString().split("T")[0];
    renderOverview();
  </script>
</body>
</html>
